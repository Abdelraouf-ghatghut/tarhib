name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 : Backend NestJS — lint / type-check / test / build
  #         + export du contrat OpenAPI comme artefact
  # ──────────────────────────────────────────────────────────────
  build-test-node:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarhib
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tarhib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tarhib:test@localhost:5432/tarhib_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      TYPEORM_MIGRATIONS_RUN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run migration:run -w apps/backend

      - name: Backend tests
        run: npm test -w apps/backend -- --runInBand

      - name: Backend build
        run: npm run build -w apps/backend

      - name: Web Admin build
        run: npm run build -w apps/web-admin

      - name: Production dependency audit (Backend and Web Admin)
        run: npm audit --omit=dev --audit-level=high -w apps/backend -w apps/web-admin

      # Expo/Metro currently pulls image-size versions reported by npm audit,
      # while npm's only automatic remedy is a breaking downgrade to Expo 46.
      # Keep the report visible without hiding failures in the deployable Node services.
      - name: Mobile dependency audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high -w apps/mobile-employee -w apps/mobile-operations

      - name: Export OpenAPI spec
        run: npm run export:openapi -w apps/backend

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: apps/backend/openapi/openapi.json
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 1b : Tests d'intégration/concurrence sur un VRAI PostgreSQL
  #          (harness PR-0.0 — garanties commandes/stock/quotas).
  #          Les cas connus non corrigés sont en `it.failing` : verts tant
  #          que le bug existe, rouges quand un correctif les rend justes.
  # ──────────────────────────────────────────────────────────────
  integration-test-node:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarhib
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tarhib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tarhib:test@localhost:5432/tarhib_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run migration:run -w apps/backend

      - name: Integration / concurrency tests (real PostgreSQL)
        run: npm run test:int -w apps/backend

  # ──────────────────────────────────────────────────────────────
  # Job 2 : React Native / Expo — QA et génération des bundles Android
  #         Démarre seulement si build-test-node passe
  # ──────────────────────────────────────────────────────────────
  build-test-mobile:
    needs: build-test-node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile applications
        run: |
          npm run typecheck -w apps/mobile-employee
          npm run typecheck -w apps/mobile-operations

      - name: Validate Expo configurations
        run: |
          cd apps/mobile-employee && npx expo config --type public >/dev/null
          cd ../mobile-operations && npx expo config --type public >/dev/null

      - name: Export Employee Android bundle
        run: npx expo export --platform android --output-dir dist-ci
        working-directory: apps/mobile-employee

      - name: Export Operations Android bundle
        run: npx expo export --platform android --output-dir dist-ci
        working-directory: apps/mobile-operations

      - name: Upload mobile bundles
        uses: actions/upload-artifact@v4
        with:
          name: expo-android-bundles
          path: |
            apps/mobile-employee/dist-ci
            apps/mobile-operations/dist-ci
          retention-days: 1
