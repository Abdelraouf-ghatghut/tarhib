# Phase 3 - reference Redis Sentinel config (dev/demo only). Three sentinel
# containers each get their own copy of this file (docker-compose.sentinel.yml)
# since Sentinel rewrites its config file at runtime as it discovers
# replicas/other sentinels - sharing one file across instances would race.
#
# Quorum 2 (of 3 sentinels) matches the 3-sentinel/2-replica topology below:
# tolerates one sentinel or one replica failing without losing the ability
# to agree on a failover.
port 26379
# Off by default in Redis Sentinel - without it, hostname resolution is
# attempted once at config-parse time and any Docker DNS timing hiccup at
# boot is a FATAL error (found by actually running this, not by reading docs).
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor tarhib-master redis-master 6379 2
sentinel down-after-milliseconds tarhib-master 5000
sentinel parallel-syncs tarhib-master 1
sentinel failover-timeout tarhib-master 10000
