# PR-2.3 — pile d'observabilité de référence (dev/self-hosté). Scrape le
# backend directement (host.docker.internal:3000/metrics) : le backend tourne
# sur l'hôte, pas dans docker-compose.yml (cf. .env DATABASE_URL=localhost).
# En prod, remplacer la cible par l'adresse réelle du service backend et
# restreindre l'accès réseau à /metrics au collecteur Prometheus uniquement
# (voir PRODUCTION_RUNBOOK.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tarhib-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
