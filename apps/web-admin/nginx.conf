server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toute route côté client retombe sur index.html (React Router gère
  # le routage réel) — sans ça, un rechargement sur /orders renvoie un 404 nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fichiers hashés par Vite (assets/index-XXXX.js) — cache long, sûr car
  # le nom change à chaque contenu différent. index.html jamais mis en cache
  # (défaut nginx pour un fichier sans extension listée ci-dessous), pour que
  # chaque déploiement soit vu immédiatement.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
