server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toute route côté client retombe sur index.html (React Router gère
  # le routage réel) — sans ça, un rechargement sur /orders renvoie un 404 nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fichiers hashés par Vite (assets/index-XXXX.js) — cache long, sûr car
  # le nom change à chaque contenu différent. index.html jamais mis en cache
  # (défaut nginx pour un fichier sans extension listée ci-dessous), pour que
  # chaque déploiement soit vu immédiatement.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Les fichiers Thmanyah sont une ressource interne de l'interface, pas un
  # téléchargement public. Une police web reste techniquement récupérable par
  # un utilisateur avancé : ces règles limitent l'accès direct, le hotlinking,
  # l'indexation et la mise en cache partagée sans modifier le fichier licencié.
  location ~* ^/fonts/thmanyah/[^/]+\.woff2$ {
    valid_referers tarhib.ly *.tarhib.ly;
    if ($invalid_referer) {
      return 403;
    }

    try_files $uri =404;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # Aucun listing ni fallback SPA pour le répertoire de polices.
  location /fonts/thmanyah/ {
    autoindex off;
    return 404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
